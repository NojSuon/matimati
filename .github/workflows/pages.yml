# Builds the site (Rust → static files) and publishes it to GitHub Pages on
# every push to main, and once a day so new Instagram posts appear on their own.
#
# Instagram: add the repository secret INSTAGRAM_TOKEN (Settings → Secrets and
# variables → Actions). Without it, the home page uses content/instagram.toml.
#
# One-time setup in the repo: Settings → Pages → Build and deployment →
# Source: "GitHub Actions".
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "0 12 * * *" # every day, 6:00 in Mexico City

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Test
        run: cargo test

      - name: Build site
        # Pages serves the site from /<repo-name>/
        run: cargo run --release -- --base "${{ github.event.repository.name }}"
        env:
          INSTAGRAM_TOKEN: ${{ secrets.INSTAGRAM_TOKEN }}
          # Only for "EAA…" tokens, if the account isn't found by its handle.
          INSTAGRAM_USER_ID: ${{ vars.INSTAGRAM_USER_ID }}

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
