[package]
name = "matimati-site"
description = "Builds the Mati Mati website (magazine, tools, support) into dist/ as static files"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
minijinja = { version = "2", features = ["loader", "json", "urlencode"] }
pulldown-cmark = { version = "0.12", default-features = false, features = ["html"] }
serde = { version = "1", features = ["derive"] }
toml = "0.8"
tiny_http = "0.12"
ureq = { version = "2", features = ["json"] }
serde_json = "1"

[profile.release]
opt-level = "s"
