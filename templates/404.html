{% extends "base.html" %}
{% block main %}
<section class="page-hero page-hero--404">
  <div class="wrap">
    <div class="page-hero__text">
      <span class="tag">404</span>
      <h1>{{ t.notfound.title }}</h1>
      <p class="lead">{{ t.notfound.text }}</p>
      <p class="slide__actions">
        <a class="button" href="{{ home }}">{{ t.notfound.home }}</a>
        <a class="button button--line" href="{{ base }}en/" lang="en">Go to the English site</a>
        <a class="button button--line" href="{{ base }}zh/" lang="zh-Hans">前往中文网站</a>
      </p>
    </div>
    <div class="page-hero__art patron" aria-hidden="true"></div>
  </div>
</section>
{% endblock %}
